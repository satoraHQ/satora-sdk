# Standalone crate (not part of the root Cargo workspace).
[workspace]

[package]
name = "satora-rust-sdk"
version = "0.0.1"
edition = "2024"
include = [
  "/build.rs",
  "/Cargo.lock",
  "/Cargo.toml",
  "/README.md",
  "/PARITY_PLAN.md",
  "/examples/**",
  "/openapi.json",
  "/src/**",
  "/tests/**",
]
license = "MIT"
repository = "https://github.com/satoraHQ/swap"
rust-version = "1.94"
description = "Lendaswap Client SDK (Rust). FFI-friendly public API; the schema is verified against the upstream OpenAPI spec."

[lib]
name = "lendaswap_sdk"
crate-type = ["rlib"]

[features]
# Gasless EVM funding via ERC-4337 (EntryPoint v0.7) + EIP-7702 delegation
# to a ZeroDev Kernel V3.3 implementation. Off by default: pulls in alloy,
# so the base SDK (quote, create_swap) stays lean and the FFI / dotnet
# layer can opt out.
gasless = [
  "dep:alloy",
  "dep:alloy-provider",
  "dep:alloy-dyn-abi",
  "dep:getrandom_03",
  "dep:tower-service",
]

electrum = ["dep:electrum-client"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:uuid"]

[dependencies]
# Crypto: HD wallet derivation, secp256k1, hashes.
# `bitcoin` re-exports `secp256k1`; no need to pull it in directly.
bip39 = "2"
bitcoin = { version = "0.32", default-features = false, features = ["std", "serde"] }
hex = "0.4"
# The version the swap server parses invoices with, so both accept the same ones.
lightning-invoice = "0.33.2"
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
# `log` forwards SDK events to a `log` crate logger when no tracing subscriber is set.
tracing = { version = "0.1", features = ["log"] }
url = "2"

# Account-abstraction (`gasless` feature only). `sol-types` for the `sol!`
# ABI blocks, `rpc-types` for the ERC-4337 `PackedUserOperation` wire type,
# `providers` + `transport-http` for the bundler RPC. `alloy-provider` is
# pulled in directly *with* the `erc4337-api` feature because the umbrella
# `alloy` crate doesn't re-export that feature (it gates the `Erc4337Api`
# extension trait — `eth_sendUserOperation` / `estimate_user_operation_gas`
# / `get_user_operation_receipt`).
alloy = { version = "1", optional = true, features = ["sol-types", "rpc-types", "providers", "transport-http", "signer-local"] }
alloy-dyn-abi = { version = "1", optional = true, features = ["eip712"] }
alloy-provider = { version = "1", optional = true, features = ["erc4337-api"] }
# `rand` is used by both the gasless flow (Permit2 nonces) and the
# Arkade settle flow (ark-rs `Client::settle` requires a CSPRNG).
rand = "0.8"
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["time", "rt"] }
electrum-client = { version = "0.24.1", optional = true }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
uuid = { version = "1", optional = true }
tokio-tungstenite = { version = "0.28", optional = true, features = ["native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Arkade VHTLC claim + balance + settle. `ark-rs` for the core VHTLC
# script + gRPC client to arkd, `ark-bdk-wallet` for the on-chain
# wallet plumbing ark-client demands, `esplora-client` for chain
# queries. Versions track `scripts/e2e-rust/Cargo.toml`.
ark-bdk-wallet = "0.12.1"
# The offboard fee estimator; ark-client uses it without re-exporting it.
ark-fees = "0.12.1"
ark-rs = { version = "0.12.1", features = ["client", "grpc", "sqlite"] }
esplora-client = { version = "0.11", default-features = false, features = ["async", "async-https", "tokio"] }

# rustls 0.23 demands an explicit CryptoProvider install before any TLS
# handshake — otherwise the first https call (Arkade gRPC, esplora over
# TLS, …) panics with "Could not automatically determine the
# process-level CryptoProvider". We pull rustls in as a direct dep so
# we can call `rustls::crypto::ring::default_provider().install_default()`
# from `Client::new` / `ClientBuilder::build`; the `ring` feature pins
# the backend we want without leaving the choice to feature unification.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
alloy = { version = "1", optional = true, features = ["wasm-bindgen", "json-rpc"] }
# Enable the JS entropy backend for rand and the Alloy dependency graph.
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", optional = true, features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
tower-service = { version = "0.3", optional = true }
web-time = "1"

[build-dependencies]
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
jsonschema = { version = "0.46.4", default-features = false }
log = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
